name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zaezd_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zaezd_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zaezd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: Юнит-тесты (расчёт цены, iCal, права, защита ссылок)
        run: npm test
      - name: Миграции на тестовой базе
        run: npx prisma migrate deploy
      - name: Интеграционные тесты (server actions против PostgreSQL)
        run: npm run test:int
      - name: Сборка
        run: npm run build
        env:
          JWT_SECRET: ci-build-secret-ci-build-secret-ci-build
